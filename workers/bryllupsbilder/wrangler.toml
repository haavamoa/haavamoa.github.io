name = "bryllupsbilder"
main = "index.js"
compatibility_date = "2026-08-16"

[vars]
ALLOWED_ORIGINS = "https://haavamoa.github.io"
GITHUB_OWNER = "haavamoa"
GITHUB_REPO = "bryllupsbilder-2026"
GITHUB_RELEASE_ID = "371313329"
ADMIN_GITHUB_LOGIN = "haavamoa"
ADMIN_URL = "https://haavamoa.github.io/bryllup/bilder/admin/"
GITHUB_OAUTH_CALLBACK_URL = "https://bryllupsbilder.bryllupsbilder.workers.dev/auth/callback"
GITHUB_OAUTH_CLIENT_ID = "Ov23liTpyUx9wmLpWG46"

[secrets]
required = [ "ADMIN_SESSION_SECRET", "GITHUB_OAUTH_CLIENT_SECRET", "GITHUB_TOKEN" ]

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "26090501"

	[ratelimits.simple]
	limit = 30
	period = 60

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "26090502"

	[ratelimits.simple]
	limit = 300
	period = 60