<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4d5440" />
  <meta name="admin-api" content="https://bryllupsbilder.bryllupsbilder.workers.dev" />
  <title>Bildeoversikt · Ida og Håvard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --cream: #f8f5f0;
      --sand: #ede8df;
      --gold: #cba979;
      --olive: #6d745c;
      --olive-dark: #4d5440;
      --coral: #b95f4b;
      --text: #2f2e29;
      --muted: #68665e;
      --white: #ffffff;
      --border: #d8d1c5;
      --error: #a53f34;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        repeating-linear-gradient(135deg, transparent 0, transparent 18px, rgba(109, 116, 92, 0.035) 18px, rgba(109, 116, 92, 0.035) 19px),
        var(--cream);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      line-height: 1.5;
    }

    header {
      background: var(--olive-dark);
      color: var(--white);
      padding: 24px max(20px, calc((100vw - 1180px) / 2));
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .back-link {
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-link:hover,
    .back-link:focus-visible { color: var(--white); text-decoration: underline; }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 64px;
    }

    .login-panel {
      width: min(520px, 100%);
      margin: 48px auto 0;
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 10px 28px rgba(66, 61, 51, 0.1);
      text-align: center;
    }

    .login-panel h2 {
      margin: 0 0 8px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .login-panel p { margin: 0 0 22px; color: var(--muted); }

    .primary-button,
    .toolbar-button,
    .delete-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 5px;
      font: 700 0.86rem/1 'Lato', sans-serif;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
    }

    .primary-button {
      background: var(--olive);
      color: var(--white);
      padding: 0 24px;
    }

    .primary-button:hover,
    .primary-button:focus-visible { background: var(--olive-dark); }

    .admin-view[hidden],
    .login-panel[hidden] { display: none; }

    .toolbar {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .count strong { color: var(--text); }

    .toolbar-actions { display: flex; gap: 8px; }

    .toolbar-button {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 15px;
    }

    .toolbar-button:hover,
    .toolbar-button:focus-visible { background: var(--sand); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .photo-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--white);
      box-shadow: 0 3px 12px rgba(66, 61, 51, 0.07);
    }

    .photo-frame {
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #e5e2da;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .photo-details { padding: 15px; }

    .photo-label {
      margin: 0 0 4px;
      overflow: hidden;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .photo-meta {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .delete-button {
      width: 100%;
      background: transparent;
      border: 1px solid #d4a39a;
      color: var(--error);
    }

    .delete-button:hover,
    .delete-button:focus-visible { background: #faece9; }

    .delete-button:disabled,
    .toolbar-button:disabled { cursor: wait; opacity: 0.55; }

    .message,
    .empty-state {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
    }

    .message { margin: 0 0 20px; padding: 12px 16px; }
    .message.is-error { border-color: #d9aaa2; background: #faece9; color: var(--error); }
    .message[hidden], .empty-state[hidden] { display: none; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(196, 110, 88, 0.4);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .header-row { align-items: flex-start; }
      main { width: min(100% - 24px, 1180px); padding-top: 22px; }
      .login-panel { margin-top: 20px; padding: 28px 20px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .toolbar-button { flex: 1; }
      .gallery { grid-template-columns: 1fr 1fr; gap: 10px; }
      .photo-details { padding: 11px; }
    }

    @media (max-width: 380px) {
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <p class="eyebrow">Ida &amp; Håvard</p>
        <h1>Bildeoversikt</h1>
      </div>
      <a class="back-link" href="../">Til opplastingssiden</a>
    </div>
  </header>

  <main>
    <p class="message is-error" id="pageMessage" role="alert" hidden></p>

    <section class="login-panel" id="loginPanel">
      <h2>Privat administrasjon</h2>
      <p>Logg inn med GitHub-brukeren din for å se og slette opplastede bilder.</p>
      <a class="primary-button" id="loginButton" href="#">Logg inn med GitHub</a>
    </section>

    <section class="admin-view" id="adminView" hidden>
      <div class="toolbar">
        <p class="count" id="photoCount">Henter bilder …</p>
        <div class="toolbar-actions">
          <button class="toolbar-button" id="refreshButton" type="button">Oppdater</button>
          <button class="toolbar-button" id="logoutButton" type="button">Logg ut</button>
        </div>
      </div>

      <div class="gallery" id="gallery" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden>Ingen bilder er lastet opp ennå.</div>
    </section>
  </main>

  <script>
    const apiBase = document.querySelector('meta[name="admin-api"]').content;
    const sessionKey = 'bryllup-admin-session';
    const loginPanel = document.getElementById('loginPanel');
    const adminView = document.getElementById('adminView');
    const loginButton = document.getElementById('loginButton');
    const refreshButton = document.getElementById('refreshButton');
    const logoutButton = document.getElementById('logoutButton');
    const photoCount = document.getElementById('photoCount');
    const gallery = document.getElementById('gallery');
    const emptyState = document.getElementById('emptyState');
    const pageMessage = document.getElementById('pageMessage');
    const objectUrls = new Map();
    let session = sessionStorage.getItem(sessionKey) || '';
    let assets = [];

    loginButton.href = `${apiBase}/auth/github`;
    refreshButton.addEventListener('click', loadAssets);
    logoutButton.addEventListener('click', () => logOut());

    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get('session')) {
      session = hash.get('session');
      sessionStorage.setItem(sessionKey, session);
      history.replaceState({}, '', location.pathname);
    }

    const loginError = new URLSearchParams(location.search).get('error');
    if (loginError) {
      showMessage(loginError);
      history.replaceState({}, '', location.pathname);
    }

    if (session) {
      showAdmin();
      loadAssets();
    } else {
      showLogin();
    }

    async function loadAssets() {
      setToolbarBusy(true);
      hideMessage();
      photoCount.textContent = 'Henter bilder …';

      try {
        const response = await adminFetch('/admin/assets');
        if (response.status === 401) {
          logOut('Økten er utløpt. Logg inn på nytt.');
          return;
        }

        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Kunne ikke hente bildene.');

        assets = result.assets || [];
        renderAssets();
      } catch (error) {
        showMessage(error.message || 'Kunne ikke hente bildene.');
        photoCount.textContent = 'Bildene kunne ikke lastes';
      } finally {
        setToolbarBusy(false);
      }
    }

    function renderAssets() {
      revokeObjectUrls();
      gallery.replaceChildren();
      emptyState.hidden = assets.length > 0;
      photoCount.innerHTML = `<strong>${assets.length}</strong> ${assets.length === 1 ? 'bilde' : 'bilder'}`;

      for (const asset of assets) {
        const card = document.createElement('article');
        card.className = 'photo-card';

        const frame = document.createElement('div');
        frame.className = 'photo-frame';
        frame.textContent = 'Laster …';

        const details = document.createElement('div');
        details.className = 'photo-details';

        const label = document.createElement('p');
        label.className = 'photo-label';
        label.textContent = asset.label || 'Bilde fra en gjest';
        label.title = label.textContent;

        const meta = document.createElement('p');
        meta.className = 'photo-meta';
        meta.textContent = `${formatDate(asset.createdAt)} · ${formatSize(asset.size)}`;

        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-button';
        deleteButton.type = 'button';
        deleteButton.textContent = 'Slett bilde';
        deleteButton.addEventListener('click', () => deleteAsset(asset, deleteButton));

        details.append(label, meta, deleteButton);
        card.append(frame, details);
        gallery.append(card);
        loadPreview(asset, frame);
      }
    }

    async function loadPreview(asset, frame) {
      try {
        const response = await adminFetch(`/admin/assets/${asset.id}/content`);
        if (!response.ok) throw new Error();

        const objectUrl = URL.createObjectURL(await response.blob());
        objectUrls.set(asset.id, objectUrl);
        const image = document.createElement('img');
        image.alt = asset.label || 'Opplastet bryllupsbilde';
        image.loading = 'lazy';
        image.addEventListener('error', () => {
          frame.replaceChildren('Forhåndsvisning ikke tilgjengelig');
        }, { once: true });
        image.src = objectUrl;
        frame.replaceChildren(image);
      } catch {
        frame.textContent = 'Kunne ikke laste bildet';
      }
    }

    async function deleteAsset(asset, button) {
      const description = asset.label || 'dette bildet';
      if (!confirm(`Vil du slette ${description}? Dette kan ikke angres.`)) return;

      button.disabled = true;
      button.textContent = 'Sletter …';

      try {
        const response = await adminFetch(`/admin/assets/${asset.id}`, { method: 'DELETE' });
        if (response.status === 401) {
          logOut('Økten er utløpt. Logg inn på nytt.');
          return;
        }
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || 'Kunne ikke slette bildet.');
        }

        assets = assets.filter((candidate) => candidate.id !== asset.id);
        renderAssets();
      } catch (error) {
        showMessage(error.message || 'Kunne ikke slette bildet.');
        button.disabled = false;
        button.textContent = 'Slett bilde';
      }
    }

    function adminFetch(path, options = {}) {
      return fetch(`${apiBase}${path}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${session}`,
          ...options.headers,
        },
      });
    }

    function showAdmin() {
      loginPanel.hidden = true;
      adminView.hidden = false;
    }

    function showLogin() {
      loginPanel.hidden = false;
      adminView.hidden = true;
    }

    function logOut(message = '') {
      session = '';
      assets = [];
      sessionStorage.removeItem(sessionKey);
      revokeObjectUrls();
      gallery.replaceChildren();
      showLogin();
      if (message) showMessage(message);
    }

    function revokeObjectUrls() {
      for (const objectUrl of objectUrls.values()) URL.revokeObjectURL(objectUrl);
      objectUrls.clear();
    }

    function setToolbarBusy(isBusy) {
      refreshButton.disabled = isBusy;
      refreshButton.textContent = isBusy ? 'Oppdaterer …' : 'Oppdater';
    }

    function showMessage(message) {
      pageMessage.textContent = message;
      pageMessage.hidden = false;
    }

    function hideMessage() {
      pageMessage.textContent = '';
      pageMessage.hidden = true;
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat('no-NO', {
        dateStyle: 'medium',
        timeStyle: 'short',
      }).format(new Date(value));
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} kB`;
      return `${(bytes / 1024 / 1024).toFixed(1).replace('.', ',')} MB`;
    }
  </script>
</body>
</html>
