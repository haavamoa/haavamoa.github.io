<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d745c" />
  <meta name="upload-endpoint" content="https://bryllupsbilder.bryllupsbilder.workers.dev/upload" />
  <title>Del bilder · Ida og Håvard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@400;600&family=Lato:wght@300;400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --cream: #f8f5f0;
      --sand: #ede8df;
      --gold: #cba979;
      --gold-dark: #9a642f;
      --olive: #6d745c;
      --olive-dark: #4d5440;
      --coral: #c46e58;
      --text: #2f2e29;
      --muted: #68665e;
      --white: #ffffff;
      --border: #d8d1c5;
      --success: #3f704d;
      --error: #a53f34;
      --image-radius: 10px;
    }

    html { background: var(--cream); }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        repeating-linear-gradient(135deg, transparent 0, transparent 18px, rgba(109, 116, 92, 0.035) 18px, rgba(109, 116, 92, 0.035) 19px),
        var(--cream);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    .hero {
      min-height: 250px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: url('https://github.com/user-attachments/assets/602e7ee5-5c57-437e-9bfb-ed2efac5fe86') center 58% / cover no-repeat;
      color: var(--white);
      text-align: center;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(38, 42, 32, 0.58);
    }

    .hero-content {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: 50px 0 42px;
    }

    .back-link {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 1;
      color: var(--white);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible { text-decoration: underline; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.7rem, 12vw, 4.6rem);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
    }

    .hero p:last-child {
      max-width: 520px;
      margin: 15px auto 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.98rem;
    }

    main {
      width: min(680px, calc(100% - 32px));
      margin: -20px auto 0;
      padding: 0 0 64px;
      position: relative;
    }

    .upload-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(66, 61, 51, 0.12);
      overflow: hidden;
    }

    .picker {
      min-height: 250px;
      display: grid;
      place-items: center;
      padding: 30px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--sand);
      text-align: center;
      transition: background 160ms ease, outline-color 160ms ease;
    }

    .picker.is-dragging {
      background: #e4e8dc;
      outline: 3px solid var(--gold);
      outline-offset: -3px;
    }

    .picker.has-preview {
      min-height: 0;
      padding: 0;
      background: #24251f;
    }

    .picker-actions { width: min(100%, 390px); }

    .camera-mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border: 2px solid var(--gold-dark);
      border-radius: 50%;
      color: var(--gold-dark);
      font-family: Georgia, serif;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .choice-button,
    .submit-button,
    .change-button,
    .preview-action {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      font: 700 0.88rem/1 'Lato', sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .choice-button {
      background: var(--olive);
      color: var(--white);
      padding: 0 14px;
    }

    .choice-button.secondary {
      background: var(--white);
      border: 1px solid var(--olive);
      color: var(--olive-dark);
    }

    .choice-button:hover,
    .choice-button:focus-visible,
    .submit-button:hover,
    .submit-button:focus-visible { background: var(--olive-dark); }

    .choice-button.secondary:hover,
    .choice-button.secondary:focus-visible { background: #e4e8dc; }

    .choice-button:active,
    .submit-button:active,
    .change-button:active { transform: translateY(1px); }

    .preview-wrap {
      display: none;
      width: 100%;
      min-height: 220px;
      padding: 18px;
      position: relative;
      color: var(--white);
    }

    .has-preview .preview-wrap { display: block; }
    .has-preview .picker-actions { display: none; }

    .preview-summary {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.88rem;
      font-weight: 700;
      text-align: left;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .preview-item {
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: var(--image-radius);
      background: #11140f;
    }

    .preview-image {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: var(--image-radius);
      object-fit: cover;
    }

    .preview-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .preview-action,
    .change-button {
      min-height: 42px;
      padding: 0 17px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--text);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    }

    .preview-actions .preview-action,
    .preview-actions .change-button {
      min-width: 0;
      padding: 0 9px;
      font-size: 0.68rem;
      letter-spacing: 0;
      line-height: 1.05;
      text-align: center;
    }

    .preview-action.secondary {
      background: rgba(255, 255, 255, 0.78);
    }

    .form-fields { padding: 28px 30px 30px; }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .choice-button,
    .preview-action { margin-bottom: 0; }

    .optional {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 400;
    }

    input[type='text'],
    input[type='password'],
    textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--cream);
      color: var(--text);
      font: 400 1rem/1.2 'Lato', sans-serif;
      padding: 11px 13px;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus-visible,
    button:focus-visible,
    .choice-button:focus-visible {
      outline: 3px solid rgba(196, 110, 88, 0.4);
      outline-offset: 2px;
    }

    .privacy-note {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .submit-button {
      width: 100%;
      background: var(--coral);
      color: var(--white);
      padding: 0 20px;
    }

    .submit-button:hover,
    .submit-button:focus-visible { background: #a95442; }

    .submit-button:disabled {
      background: #aaa79f;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;
      margin: 16px 0 0;
      border-left: 4px solid var(--olive);
      padding: 10px 12px;
      background: #edf1e8;
      color: var(--olive-dark);
      font-size: 0.9rem;
      font-weight: 400;
    }

    .status.is-visible { display: block; }
    .status.is-error { border-color: var(--error); background: #faece9; color: var(--error); }
    .status.is-success { border-color: var(--success); background: #e8f2ea; color: var(--success); }

    .afterword {
      margin: 24px auto 0;
      color: var(--muted);
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
    }

    @media (max-width: 520px) {
      .hero { min-height: 230px; }
      .hero-content { padding-top: 62px; }
      .choice-row { grid-template-columns: 1fr; }
      .picker { min-height: 280px; }
      .picker.has-preview { min-height: 0; }
      .preview-wrap { height: min(36vh, 270px); min-height: 0; overflow-y: auto; }
      .preview-grid { max-height: 118px; }
      .form-fields { padding: 24px 20px 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <a class="back-link" href="../">← Bryllupsinfo</a>
    <div class="hero-content">
      <p class="eyebrow">Ida &amp; Håvard · 5. september 2026</p>
      <h1>Del bildene dine</h1>
      <p>Hjelp oss å samle de små og store øyeblikkene fra dagen.</p>
    </div>
  </header>

  <main>
    <form class="upload-panel" id="uploadForm" novalidate>
      <div class="picker" id="picker">
        <div class="picker-actions">
          <div class="camera-mark" aria-hidden="true">📷</div>
          <div class="choice-row">
            <label class="choice-button" for="cameraInput">ta bilde</label>
            <label class="choice-button secondary" for="galleryInput">last opp bilde</label>
          </div>
        </div>

        <div class="preview-wrap">
          <p class="preview-summary" id="previewSummary"></p>
          <div class="preview-grid" id="previewGrid" aria-live="polite"></div>
          <div class="preview-actions">
            <button class="preview-action" id="addCameraButton" type="button">ta flere</button>
            <button class="preview-action secondary" id="addGalleryButton" type="button">velg flere</button>
            <button class="change-button" id="changeButton" type="button">tøm</button>
          </div>
        </div>
      </div>

      <input class="file-input" id="cameraInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif" capture="environment" />
      <input class="file-input" id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/avif" multiple />

      <div class="form-fields">
        <div class="field">
          <label for="guestName">Navnet ditt <span class="optional">(valgfritt)</span></label>
          <input id="guestName" name="name" type="text" maxlength="60" autocomplete="name" />
        </div>

        <div class="field">
          <label for="greeting">Hilsen <span class="optional">(valgfritt)</span></label>
          <textarea id="greeting" name="greeting" maxlength="140" placeholder="Skriv en kort hilsen til brudeparet"></textarea>
        </div>

        <p class="privacy-note">Bildene lagres i et privat GitHub-repo på Håvards GitHub.com-profil og er ikke offentlig tilgjengelige.</p>

        <button class="submit-button" id="submitButton" type="submit" disabled>Last opp bilde</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </form>

    <p class="afterword">Takk for at du deler dagen med oss ♥</p>
  </main>

  <script>
    const MAX_FILE_BYTES = 30 * 1024 * 1024;
    const MAX_SELECTION_FILES = 250;
    const MAX_UPLOAD_BATCH_FILES = 30;
    const MAX_UPLOAD_BATCH_BYTES = 80 * 1024 * 1024;
    const SUPPORTED_IMAGE_EXTENSIONS = /\.(jpe?g|png|webp|heic|heif|avif)$/i;
    const uploadEndpoint = document.querySelector('meta[name="upload-endpoint"]').content;
    const form = document.getElementById('uploadForm');
    const picker = document.getElementById('picker');
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const previewSummary = document.getElementById('previewSummary');
    const previewGrid = document.getElementById('previewGrid');
    const addCameraButton = document.getElementById('addCameraButton');
    const addGalleryButton = document.getElementById('addGalleryButton');
    const changeButton = document.getElementById('changeButton');
    const guestNameInput = document.getElementById('guestName');
    const submitButton = document.getElementById('submitButton');
    const status = document.getElementById('status');
    const uploadClientId = getUploadClientId();
    let selectedImages = [];

    cameraInput.addEventListener('change', () => addFiles(cameraInput.files));
    galleryInput.addEventListener('change', () => addFiles(galleryInput.files));
    addCameraButton.addEventListener('click', () => cameraInput.click());
    addGalleryButton.addEventListener('click', () => galleryInput.click());
    changeButton.addEventListener('click', resetFiles);
    window.addEventListener('pageshow', restoreFileStateIfNeeded);

    for (const eventName of ['dragenter', 'dragover']) {
      picker.addEventListener(eventName, (event) => {
        event.preventDefault();
        picker.classList.add('is-dragging');
      });
    }

    for (const eventName of ['dragleave', 'drop']) {
      picker.addEventListener(eventName, (event) => {
        event.preventDefault();
        picker.classList.remove('is-dragging');
      });
    }

    picker.addEventListener('drop', (event) => addFiles(event.dataTransfer.files));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      restoreFileStateIfNeeded();

      if (selectedImages.length === 0) {
        resetFiles(false);
        showStatus('Velg minst ett bilde først.', 'error');
        return;
      }

      if (uploadEndpoint.includes('REPLACE-ME')) {
        showStatus('Opplastingen er ikke åpnet ennå. Prøv igjen senere.', 'error');
        return;
      }

      const uploadBatches = buildUploadBatches(selectedImages);
      const name = document.getElementById('guestName').value;
      const greeting = document.getElementById('greeting').value;
      const uploadedImages = [];

      setUploading(true);

      try {
        for (const [index, batch] of uploadBatches.entries()) {
          showStatus(`Laster opp ${batch.length} ${batch.length === 1 ? 'bilde' : 'bilder'} (${index + 1} av ${uploadBatches.length}) …`);
          await uploadBatch(batch, name, greeting);
          uploadedImages.push(...batch);
        }

        showStatus(getUploadSuccessText(uploadedImages.length), 'success');
        form.reset();
        resetFiles(false);
      } catch (error) {
        if (uploadedImages.length > 0) {
          removeSelectedImages(uploadedImages);
          showStatus(
            `${uploadedImages.length} ${uploadedImages.length === 1 ? 'bilde ble' : 'bilder ble'} lastet opp. ${selectedImages.length} ${selectedImages.length === 1 ? 'bilde ligger' : 'bilder ligger'} igjen. ${error.message || 'Prøv igjen.'}`,
            'error',
          );
        } else {
          showStatus(error.message || 'Kunne ikke laste opp bildene. Sjekk nettet og prøv igjen.', 'error');
        }
      } finally {
        setUploading(false);
      }
    });

    function addFiles(fileList, options = {}) {
      const { focusOnMobile = true, clearStatusOnSuccess = true } = options;
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      const hadNoImages = selectedImages.length === 0;
      const messages = [];

      for (const file of files) {
        if (selectedImages.length >= MAX_SELECTION_FILES) {
          messages.push(`Du kan velge maks ${MAX_SELECTION_FILES} bilder om gangen. Last opp disse først.`);
          break;
        }

        if (!isSelectableImageFile(file)) {
          messages.push(`${file.name || 'En fil'} er ikke et bilde.`);
          continue;
        }

        if (file.size > MAX_FILE_BYTES) {
          messages.push(`${file.name || 'Et bilde'} er for stort. Maks 30 MB per bilde.`);
          continue;
        }

        selectedImages.push({ file, previewUrl: URL.createObjectURL(file) });
      }

      renderSelectedImages();

      if (messages.length > 0) {
        showStatus(messages[0], 'error');
      } else if (clearStatusOnSuccess) {
        hideStatus();
      }

      if (focusOnMobile && hadNoImages && selectedImages.length > 0) focusGuestNameOnMobile();
    }

    function resetFiles(clearStatus = true) {
      for (const selectedImage of selectedImages) URL.revokeObjectURL(selectedImage.previewUrl);
      selectedImages = [];
      cameraInput.value = '';
      galleryInput.value = '';
      picker.classList.remove('has-preview');
      previewGrid.replaceChildren();
      previewSummary.textContent = '';
      updateSubmitButton();
      if (clearStatus) hideStatus();
    }

    function setUploading(isUploading) {
      submitButton.disabled = isUploading || selectedImages.length === 0;
      submitButton.textContent = isUploading
        ? `Laster opp ${selectedImages.length} ${selectedImages.length === 1 ? 'bilde' : 'bilder'} …`
        : getSubmitText();
      cameraInput.disabled = isUploading;
      galleryInput.disabled = isUploading;
      addCameraButton.disabled = isUploading;
      addGalleryButton.disabled = isUploading;
      changeButton.disabled = isUploading;
    }

    function restoreFileStateIfNeeded() {
      if (selectedImages.length > 0) return;

      const inputFiles = [...cameraInput.files, ...galleryInput.files];
      if (inputFiles.length > 0) {
        addFiles(inputFiles, { focusOnMobile: false, clearStatusOnSuccess: false });
        return;
      }

      if (picker.classList.contains('has-preview')) resetFiles(false);
    }

    async function uploadBatch(batch, name, greeting) {
      const formData = new FormData();
      for (const selectedImage of batch) {
        formData.append('images', selectedImage.file, selectedImage.file.name);
      }
      formData.append('name', name);
      formData.append('greeting', greeting);

      const response = await fetch(uploadEndpoint, {
        method: 'POST',
        headers: { 'X-Upload-Client': uploadClientId },
        body: formData,
      });
      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(result.error || 'Opplastingen mislyktes. Prøv igjen.');
      }
    }

    function buildUploadBatches(images) {
      const batches = [];
      let batch = [];
      let batchBytes = 0;

      for (const selectedImage of images) {
        const fileBytes = selectedImage.file.size;
        const wouldExceedBatch = batch.length > 0 && (
          batch.length >= MAX_UPLOAD_BATCH_FILES ||
          batchBytes + fileBytes > MAX_UPLOAD_BATCH_BYTES
        );

        if (wouldExceedBatch) {
          batches.push(batch);
          batch = [];
          batchBytes = 0;
        }

        batch.push(selectedImage);
        batchBytes += fileBytes;
      }

      if (batch.length > 0) batches.push(batch);
      return batches;
    }

    function renderSelectedImages() {
      previewGrid.replaceChildren();

      if (selectedImages.length === 0) {
        picker.classList.remove('has-preview');
        previewSummary.textContent = '';
        updateSubmitButton();
        return;
      }

      for (const selectedImage of selectedImages) {
        const item = document.createElement('div');
        item.className = 'preview-item';
        const image = document.createElement('img');
        image.className = 'preview-image';
        image.src = selectedImage.previewUrl;
        image.alt = selectedImage.file.name || 'Valgt bilde';
        item.append(image);
        previewGrid.append(item);
      }

      picker.classList.add('has-preview');
      previewSummary.textContent = selectedImages.length === 1
        ? '1 bilde klart for opplasting'
        : `${selectedImages.length} bilder klare for opplasting`;
      updateSubmitButton();
    }

    function isSelectableImageFile(file) {
      if (file.type.startsWith('image/')) return true;

      return SUPPORTED_IMAGE_EXTENSIONS.test(file.name || '');
    }

    function removeSelectedImages(imagesToRemove) {
      const uploaded = new Set(imagesToRemove);
      for (const selectedImage of imagesToRemove) URL.revokeObjectURL(selectedImage.previewUrl);
      selectedImages = selectedImages.filter((selectedImage) => !uploaded.has(selectedImage));
      renderSelectedImages();
    }

    function getUploadSuccessText(count) {
      return count === 1
        ? 'Bildet er lastet opp. Tusen takk!'
        : `${count} bilder er lastet opp. Tusen takk!`;
    }

    function updateSubmitButton() {
      submitButton.disabled = selectedImages.length === 0;
      submitButton.textContent = getSubmitText();
    }

    function getSubmitText() {
      return selectedImages.length > 1 ? `Last opp ${selectedImages.length} bilder` : 'Last opp bilde';
    }

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = `status is-visible${type ? ` is-${type}` : ''}`;
    }

    function hideStatus() {
      status.textContent = '';
      status.className = 'status';
    }

    function focusGuestNameOnMobile() {
      if (!matchMedia('(max-width: 520px)').matches) return;

      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      placeGuestNameCaret();
      requestAnimationFrame(() => {
        guestNameInput.scrollIntoView({
          behavior: reducedMotion ? 'auto' : 'smooth',
          block: 'center',
        });
        setTimeout(placeGuestNameCaret, reducedMotion ? 0 : 350);
      });
    }

    function placeGuestNameCaret() {
      guestNameInput.focus({ preventScroll: true });
      const caretPosition = guestNameInput.value.length;
      guestNameInput.setSelectionRange(caretPosition, caretPosition);
    }

    function getUploadClientId() {
      const storageKey = 'bryllup-upload-client';

      try {
        const storedId = localStorage.getItem(storageKey);
        if (storedId) return storedId;

        const newId = crypto.randomUUID();
        localStorage.setItem(storageKey, newId);
        return newId;
      } catch {
        return crypto.randomUUID();
      }
    }
  </script>
</body>
</html>
