<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Del dagen med oss | Ida &amp; Håvard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --paper: #ffffff;
      --olive: #626a52;
      --gold: #bd955f;
      --ink: #2f2e29;
      --muted: #66645d;
    }

    html { background: var(--paper); }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 300;
    }

    .print-button {
      position: fixed;
      z-index: 2;
      top: 18px;
      right: 18px;
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      padding: 0 18px;
      font: 700 0.84rem/1 'Lato', sans-serif;
      letter-spacing: 0.03em;
      cursor: pointer;
    }

    .print-button:hover,
    .print-button:focus-visible { background: #333333; }

    .print-button:focus-visible {
      outline: 3px solid rgba(0, 0, 0, 0.25);
      outline-offset: 3px;
    }

    .poster {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      overflow: hidden;
      background: var(--paper);
    }

    .masthead {
      position: relative;
      align-self: end;
      padding: 0 22mm 12mm;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--olive);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34pt;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
    }

    .photo-copy {
      margin: 3mm 0 0;
      color: var(--muted);
      font-size: 13pt;
      line-height: 1.4;
    }

    .qr-section {
      position: relative;
      display: grid;
      justify-items: center;
      padding: 0 22mm;
    }

    .qr-frame {
      width: 104mm;
      height: 104mm;
    }

    .qr-code {
      width: 100%;
      height: 100%;
      display: block;
      padding: 5mm;
      border: 0.4mm solid rgba(189, 149, 95, 0.72);
      background: #ffffff;
      image-rendering: pixelated;
    }

    .footer {
      position: relative;
      padding: 18mm 22mm 0;
      text-align: center;
    }

    .names {
      display: inline-block;
      margin: 0;
      padding: 0 5mm 1.5mm;
      border-bottom: 0.3mm solid rgba(189, 149, 95, 0.72);
      color: var(--olive);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34pt;
      font-style: italic;
      font-weight: 400;
      line-height: 1;
    }

    .date {
      margin: 3mm 0 0;
      color: var(--muted);
      font-size: 9pt;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media screen and (max-width: 860px) {
      body { display: block; }

      .poster {
        width: 100%;
        min-height: 141.43vw;
        box-shadow: none;
        transform-origin: top left;
      }

      .masthead { padding: 0 10.5vw 5.7vw; }
      h1 { font-size: clamp(1.45rem, 6.4vw, 34pt); white-space: nowrap; }
      .photo-copy { margin-top: 1.4vw; font-size: clamp(0.65rem, 2.7vw, 13pt); }

      .qr-section { padding: 0 10.5vw; }

      .qr-frame {
        width: 49.5vw;
        height: 49.5vw;
      }

      .footer { padding: 8.6vw 10.5vw 0; }
      .names { padding: 0 2.4vw 0.7vw; font-size: clamp(1.65rem, 7vw, 34pt); }
      .date { margin-top: 1.4vw; font-size: clamp(0.48rem, 2.1vw, 9pt); }

      .print-button {
        position: sticky;
        top: 10px;
        float: right;
        margin: 10px;
      }
    }

    @media print {
      html,
      body {
        width: 210mm;
        height: 297mm;
        min-height: 0;
        background: var(--paper);
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .print-button { display: none; }

      .poster {
        width: 210mm;
        height: 297mm;
        min-height: 297mm;
        box-shadow: none;
        break-after: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <button class="print-button" type="button" onclick="window.print()">Skriv ut A4</button>

  <main class="poster" aria-label="A4-plakat for deling av bryllupsbilder">
    <header class="masthead">
      <h1>Del øyeblikkene med oss</h1>
      <p class="photo-copy">Skann koden og last opp bilder fra dagen</p>
    </header>

    <section class="qr-section" aria-label="Skann QR-koden for å dele bilder">
      <div class="qr-frame">
        <img class="qr-code" src="../meny/qr-bilder.png" alt="QR-kode til opplasting av bryllupsbilder" />
      </div>
    </section>

    <footer class="footer">
      <p class="names">Ida &amp; Håvard</p>
      <p class="date">5. september</p>
    </footer>
  </main>
</body>
</html>
