<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skriv ut bordliste - Ida og Håvard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Dancing+Script:wght@400;700&family=Montserrat:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17221f;
      --muted: #68736f;
      --paper: #ffffff;
      --page: #e8edea;
      --line: #cdd7d2;
      --green: #2d5c4f;
      --selected-font: "Dancing Script", "Snell Roundhand", cursive;
      --table-title-size: 40pt;
      --guest-name-size: 25pt;
      --title-spacing: 14mm;
      --name-spacing: 4mm;
    }

    html[data-print-size="small"] {
      --table-title-size: 34pt;
      --guest-name-size: 21pt;
      --title-spacing: 12mm;
      --name-spacing: 3.5mm;
    }

    html[data-print-size="large"] {
      --table-title-size: 46pt;
      --guest-name-size: 29pt;
      --title-spacing: 15mm;
      --name-spacing: 4.5mm;
    }

    html[data-print-size="extra-large"] {
      --table-title-size: 52pt;
      --guest-name-size: 33pt;
      --title-spacing: 16mm;
      --name-spacing: 5mm;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    [hidden] {
      display: none !important;
    }

    html {
      background: var(--page);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Gill Sans", sans-serif;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    button,
    select {
      font: inherit;
    }

    .toolbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 16px max(20px, calc((100% - 1100px) / 2));
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
    }

    .toolbar__group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .back-link,
    .print-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 5px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--green);
    }

    .print-button {
      border: 1px solid var(--green);
      background: var(--green);
      color: #fff;
      cursor: pointer;
    }

    .font-control {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .font-control select {
      min-height: 40px;
      padding: 0 34px 0 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
    }

    .print-pages {
      display: grid;
      gap: 28px;
      justify-content: center;
      padding: 36px 20px 72px;
    }

    .print-sheet {
      display: flex;
      width: min(210mm, calc(100vw - 40px));
      min-height: min(297mm, calc((100vw - 40px) * 1.414));
      padding: 24mm 20mm;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      box-shadow: 0 12px 36px rgba(23, 34, 31, 0.14);
      text-align: center;
    }

    .table-title {
      margin: 0 0 var(--title-spacing);
      font-family: var(--selected-font);
      font-size: var(--table-title-size);
      font-weight: 700;
      line-height: 1;
    }

    .guest-list {
      display: grid;
      gap: var(--name-spacing);
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: var(--selected-font);
      font-size: var(--guest-name-size);
      line-height: 1.08;
    }

    .empty-state {
      width: min(680px, calc(100% - 40px));
      margin: 80px auto;
      padding: 30px 0;
      border-block: 1px solid var(--line);
      text-align: center;
    }

    .empty-state h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem;
    }

    @media (max-width: 700px) {
      .toolbar {
        align-items: stretch;
      }

      .toolbar,
      .toolbar__group {
        width: 100%;
      }

      .font-control {
        flex: 1 1 100%;
        justify-content: space-between;
      }

      .font-control select {
        flex: 1;
        min-width: 0;
      }

      .print-sheet {
        padding: 15vw 8vw;
      }

    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        background: #fff;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .toolbar,
      .empty-state {
        display: none;
      }

      .print-pages {
        display: block;
        padding: 0;
      }

      .print-sheet {
        width: 210mm;
        height: 297mm;
        min-height: 0;
        padding: 24mm 20mm;
        overflow: hidden;
        box-shadow: none;
        break-after: auto;
        page-break-after: auto;
      }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <a class="back-link" href="./index.html">Tilbake til bordkartet</a>
    <div class="toolbar__group">
      <label class="font-control" for="tableSelect">
        Bord
        <select id="tableSelect"></select>
      </label>
      <label class="font-control" for="fontSelect">
        Font
        <select id="fontSelect">
          <option value="Dancing Script">Dancing Script</option>
          <option value="Cormorant Garamond">Cormorant Garamond</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Georgia">Georgia</option>
        </select>
      </label>
      <label class="font-control" for="sizeSelect">
        Størrelse
        <select id="sizeSelect">
          <option value="small">Liten</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
          <option value="extra-large">Extra large</option>
        </select>
      </label>
      <button class="print-button" type="button" id="printButton">Skriv ut</button>
    </div>
  </header>

  <main class="print-pages" id="printPages"></main>

  <section class="empty-state" id="emptyState" hidden>
    <h1>Fant ingen bordliste</h1>
    <p>Åpne utskriftssiden fra bordkartet for å ta med valgt løsning.</p>
    <a class="back-link" href="./index.html">Tilbake til bordkartet</a>
  </section>

  <script>
    const printPages = document.querySelector("#printPages");
    const emptyState = document.querySelector("#emptyState");
    const tableSelect = document.querySelector("#tableSelect");
    const fontSelect = document.querySelector("#fontSelect");
    const sizeSelect = document.querySelector("#sizeSelect");
    const payload = new URLSearchParams(window.location.search).get("data");

    function renderPrintPages(data) {
      tableSelect.replaceChildren();

      data.tables.forEach((table) => {
        const option = document.createElement("option");
        option.value = String(table.number);
        option.textContent = `Bord ${table.number}`;
        tableSelect.appendChild(option);

        const sheet = document.createElement("section");
        sheet.className = "print-sheet";
        sheet.dataset.table = String(table.number);

        const title = document.createElement("h1");
        title.className = "table-title";
        title.textContent = `Bord ${table.number}`;

        const guestList = document.createElement("ul");
        guestList.className = "guest-list";
        table.names.forEach((name) => {
          const item = document.createElement("li");
          item.textContent = name;
          guestList.appendChild(item);
        });

        sheet.append(title, guestList);
        printPages.appendChild(sheet);
      });

      function showSelectedTable() {
        const selectedTable = tableSelect.value;
        printPages.querySelectorAll(".print-sheet").forEach((sheet) => {
          sheet.hidden = sheet.dataset.table !== selectedTable;
        });
        document.title = `Skriv ut Bord ${selectedTable} - ${data.title}`;
      }

      tableSelect.addEventListener("change", showSelectedTable);
      tableSelect.value = String(data.tables[0].number);
      showSelectedTable();
    }

    try {
      const data = JSON.parse(payload);
      if (!data || !Array.isArray(data.tables) || data.tables.length !== 8) {
        throw new Error("Ugyldig borddata");
      }
      renderPrintPages(data);
    } catch {
      printPages.hidden = true;
      emptyState.hidden = false;
    }

    fontSelect.addEventListener("change", () => {
      document.documentElement.style.setProperty("--selected-font", `"${fontSelect.value}", cursive`);
    });
    sizeSelect.addEventListener("change", () => {
      document.documentElement.dataset.printSize = sizeSelect.value;
    });
    document.documentElement.dataset.printSize = sizeSelect.value;
    document.querySelector("#printButton").addEventListener("click", () => window.print());
  </script>
</body>
</html>
