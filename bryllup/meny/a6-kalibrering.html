<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A6 utskriftskalibrering</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html,
    body {
      width: 105mm;
      height: 148mm;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .square {
      width: 20mm;
      height: 20mm;
      position: absolute;
      top: 64mm;
      left: 42.5mm;
      background: #000000;
    }

    @page {
      size: 105mm 148mm;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="square" aria-label="Svart kvadrat sentrert på A6-arket"></div>
</body>
</html>
